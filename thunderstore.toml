[config]
schemaVersion = "0.0.1"

[package]
namespace = "funlennysub"
name = "MycoMenuLib"
description = "Reusable settings UI helpers for Mycopunk mods."
websiteUrl = "https://github.com/funlennysub/MycoMenuLib"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/dev.funlennysub.MycoMenuLib.dll"
target = "BepInEx/plugins/dev.funlennysub.MycoMenuLib.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "libraries" ]


